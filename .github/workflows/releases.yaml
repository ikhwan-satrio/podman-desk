name: "Release Tauri App"

on:
  push:
    tags:
      - "v*"  # Trigger saat push tag v1.0.0, v2.0.0-beta, dll
  workflow_dispatch:  # Bisa trigger manual

# Permission untuk auto-create release
permissions:
  contents: write

jobs:
  # ========================================
  # Generate Changelog (jalan sekali di awal)
  # ========================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.read_changelog.outputs.content }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          CLIFF_VERSION=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv git-cliff-${CLIFF_VERSION}/git-cliff /usr/local/bin/
          git-cliff --version

      - name: Generate changelog
        run: |
          if git-cliff --latest --strip header -o CHANGES.md 2>/dev/null; then
            echo "✅ Changelog generated"
          else
            echo "## 🎉 Initial Release" > CHANGES.md
            echo "" >> CHANGES.md
            git log --pretty=format:"- %s (%h) by @%an" >> CHANGES.md
          fi

      - name: Read changelog
        id: read_changelog
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat CHANGES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ========================================
  # Build untuk Windows
  # ========================================
  build-windows:
    name: Build Windows (${{ matrix.config }})
    needs: changelog
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [nsis, msi]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest  # atau spesifik: '1.1.43'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Tauri App
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ needs.changelog.outputs.version }}"
          releaseBody: |
            ${{ needs.changelog.outputs.changelog }}
            
            ## 📥 Downloads
            - **Windows (.exe)**: Installer NSIS (rekomendasi)
            - **Windows (.msi)**: Windows Installer
            - **Linux (.deb)**: Debian/Ubuntu
            - **Linux (.rpm)**: Fedora/RHEL/openSUSE
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.config }}

      # Upload artifact agar bisa didownload terpisah
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ========================================
  # Build untuk Linux
  # ========================================
  build-linux:
    name: Build Linux (${{ matrix.config }})
    needs: changelog
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: [deb, rpm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest  # atau spesifik: '1.1.43'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ needs.changelog.outputs.version }}"
          releaseBody: |
            ${{ needs.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.config }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

