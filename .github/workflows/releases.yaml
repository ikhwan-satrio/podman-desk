name: "Release Tauri App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================
  # Generate Changelog
  # ========================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.read_changelog.outputs.content }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLIFF_VERSION=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$CLIFF_VERSION" ]; then
            CLIFF_VERSION="2.14.2"
            echo "API gagal, pakai versi pin: ${CLIFF_VERSION}"
          fi
          curl -sfL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv git-cliff-${CLIFF_VERSION}/git-cliff /usr/local/bin/
          git-cliff --version

      - name: Generate changelog
        run: |
          if git-cliff --latest --strip header -o CHANGES.md 2>/dev/null; then
            echo "✅ Changelog generated"
          else
            echo "## 🎉 Initial Release" > CHANGES.md
            echo "" >> CHANGES.md
            echo "### 📝 Commits" >> CHANGES.md
            git log --pretty=format:"- %s (%h) by @%an" >> CHANGES.md
          fi

      - name: Read changelog
        id: read_changelog
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat CHANGES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ========================================
  # Build Windows — upload artifact saja
  # ========================================
  build-windows:
    name: Build Windows (${{ matrix.config }})
    needs: changelog
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [nsis, msi]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.config }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
          if-no-files-found: ignore

  # ========================================
  # Build Linux — upload artifact saja
  # ========================================
  build-linux:
    name: Build Linux (${{ matrix.config }})
    needs: changelog
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: [deb, rpm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.config }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

  # ========================================
  # Release — buat release sekali, upload semua
  # ========================================
  release:
    name: Create Release
    needs: [changelog, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download semua artifact
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: List bundles
        run: find bundles -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.changelog.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ needs.changelog.outputs.changelog }}

            ## 📥 Downloads
            - **Windows (.exe)**: Installer NSIS (rekomendasi)
            - **Windows (.msi)**: Windows Installer
            - **Linux (.deb)**: Debian/Ubuntu
            - **Linux (.rpm)**: Fedora/RHEL/openSUSE
          files: bundles/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
