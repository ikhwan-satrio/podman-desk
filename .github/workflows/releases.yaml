name: "Release Tauri App"

on:
  push:
    tags:
      - "v*"  # Trigger saat push tag v1.0.0, v2.0.0-beta, dll
  workflow_dispatch:  # Bisa trigger manual

# Permission untuk auto-create release
permissions:
  contents: write

jobs:
  # ========================================
  # Generate Changelog (jalan sekali di awal)
  # ========================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Perlu semua history untuk changelog

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          writeToFile: false

  # ========================================
  # Build untuk Windows
  # ========================================
  build-windows:
    name: Build Windows (${{ matrix.config }})
    needs: changelog
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [nsis, msi]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"  # Ganti ke 'pnpm' atau 'yarn' jika pakai itu

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci  # atau: pnpm install / yarn install

      - name: Build Tauri App
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ needs.changelog.outputs.version }}"
          releaseBody: |
            ${{ needs.changelog.outputs.changelog }}
            
            ## 📥 Downloads
            - **Windows (.exe)**: Installer NSIS (rekomendasi)
            - **Windows (.msi)**: Windows Installer
            - **Linux (.deb)**: Debian/Ubuntu
            - **Linux (.rpm)**: Fedora/RHEL/openSUSE
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.config }}

      # Upload artifact agar bisa didownload terpisah
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ========================================
  # Build untuk Linux
  # ========================================
  build-linux:
    name: Build Linux (${{ matrix.config }})
    needs: changelog
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: [deb, rpm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ needs.changelog.outputs.version }}"
          releaseBody: |
            ${{ needs.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.config }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.config }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

